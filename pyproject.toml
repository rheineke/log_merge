[project]
name = "log-merge"
version = "0.1.0"
description = "Proof of concept to merge multiple log files into one time ordered log file"
readme = "README.md"
requires-python = ">=3.14.8"
dependencies = [
    "fastparquet>=2026.5",
    "numpy>=2.5",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = ["ipdb", "mypy", "ruff"]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["main.py", "merge.py"]

[tool.ruff]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = ["*_test.py"]
